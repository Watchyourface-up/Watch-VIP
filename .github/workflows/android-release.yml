name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Require production signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE: ${{ secrets.TAPORA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TAPORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAPORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAPORA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing TAPORA_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing TAPORA_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing TAPORA_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing TAPORA_KEY_PASSWORD'; exit 1; }
      - name: Restore production signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE: ${{ secrets.TAPORA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/tapora-signing"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/tapora-signing/tapora.jks"
          chmod 600 "$RUNNER_TEMP/tapora-signing/tapora.jks"
      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAPORA_KEYSTORE_FILE: ${{ runner.temp }}/tapora-signing/tapora.jks
          TAPORA_KEYSTORE_PASSWORD: ${{ secrets.TAPORA_KEYSTORE_PASSWORD }}
          TAPORA_KEY_ALIAS: ${{ secrets.TAPORA_KEY_ALIAS }}
          TAPORA_KEY_PASSWORD: ${{ secrets.TAPORA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Upload APK artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: TAPORA-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --title "TAPORA $GITHUB_REF_NAME" --generate-notes
