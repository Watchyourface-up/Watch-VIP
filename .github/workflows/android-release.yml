name: Android CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests, lint, and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew
      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Run Android integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TAPORA-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed release and GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Require production signing secrets
        env:
          KEYSTORE: ${{ secrets.TAPORA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TAPORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAPORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAPORA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing TAPORA_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing TAPORA_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing TAPORA_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing TAPORA_KEY_PASSWORD'; exit 1; }
      - name: Restore and validate production signing key
        env:
          KEYSTORE: ${{ secrets.TAPORA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TAPORA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tapora-signing"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/tapora-signing/tapora.jks"
          chmod 600 "$RUNNER_TEMP/tapora-signing/tapora.jks"
          keytool -list -keystore "$RUNNER_TEMP/tapora-signing/tapora.jks" \
            -storepass "$STORE_PASSWORD" >/dev/null
      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew
      - name: Build signed release APK
        env:
          TAPORA_KEYSTORE_FILE: ${{ runner.temp }}/tapora-signing/tapora.jks
          TAPORA_KEYSTORE_PASSWORD: ${{ secrets.TAPORA_KEYSTORE_PASSWORD }}
          TAPORA_KEY_ALIAS: ${{ secrets.TAPORA_KEY_ALIAS }}
          TAPORA_KEY_PASSWORD: ${{ secrets.TAPORA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAPORA-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --verify-tag --title "TAPORA $GITHUB_REF_NAME" --generate-notes
