name: CI
on:
  push:
    branches: [main, "dev/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devvault-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: python tools/validate_schema.py
      - run: python tools/check_secrets.py

  android-native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
      - name: Resolve and validate Expo Android autolinking metadata
        shell: bash
        run: |
          set -euo pipefail
          npx expo-modules-autolinking resolve --platform android --json > "$RUNNER_TEMP/devvault-autolinking.json"
          python tools/inspect_autolinking.py "$RUNNER_TEMP/devvault-autolinking.json"
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: devvault-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
