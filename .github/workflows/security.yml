name: Security checks

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK_DIR/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Scan repository for secrets with Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.3"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            /tmp/gitleaks detect --source . --log-opts="${GITHUB_EVENT_PULL_REQUEST_BASE_SHA}..${GITHUB_SHA}" --redact --no-banner --exit-code 1
          else
            /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
          fi

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK_DIR/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify dependency graph resolves
        run: ./gradlew --no-daemon dependencies
